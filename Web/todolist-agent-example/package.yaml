name: todo-list
version: 0.1.0.0
github: "example/todo-list"
license: BSD-3-Clause
author: "Example"
maintainer: "example@example.com"
category: Web

extra-source-files:
  - README.md
  - AGENTS.md
  - docs/*.md
  - tasks/*.md
  - migrations/*.sql

dependencies:
  - base >= 4.19 && < 5
  - aeson
  - bytestring
  - http-types
  - postgresql-simple
  - servant
  - servant-server
  - text
  - time
  - transformers
  - uuid
  - wai
  - warp

ghc-options:
  - -Wall
  - -Wcompat
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wredundant-constraints

library:
  source-dirs: src

executables:
  todo-list:
    main: Main.hs
    source-dirs: app
    dependencies:
      - todo-list
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N

tests:
  todo-list-test:
    main: Spec.hs
    source-dirs:
      - test
    dependencies:
      - todo-list
      - hspec
      - hspec-wai
      - containers
      - wai-extra

  todo-list-integration:
    main: TodoWorkflowSpec.hs
    source-dirs:
      - integration
    dependencies:
      - todo-list
      - hspec
      - postgresql-simple
      - text
