name: Context Integrity

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

# 링크 검사, 인덱스 등록, 생성 문서 최신성 검사는 python3만 필요합니다.
# Haskell 빌드에 의존하지 않게 유지하는 것이 의도된 설계입니다.
jobs:
  context-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate canonical context
        run: ./scripts/context/validate-context.sh
