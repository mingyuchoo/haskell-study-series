name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.10'
          cabal-version: '3.16'

      - name: Resolve dependencies
        run: cabal update && cabal build all --dry-run

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ runner.os }}-ghc${{ steps.setup.outputs.ghc-version }}-

      - name: Run test strategy
        run: ./scripts/quality/test.sh

      - name: Run lint strategy
        run: ./scripts/quality/lint.sh
