name:                GeneralService
version:             0.1.0.0
github:              "githubuser/GeneralService"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2026 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/GeneralService#readme>

dependencies:
- base >= 4.7 && < 5
- aeson
- bytestring
- http-types
- text
- wai
- warp

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
  - Application.Port.TaskRepository
  - Application.TaskService
  - Domain.Task
  - Infrastructure.InMemoryTaskRepository
  - Interface.Http.TaskRoutes
  - Lib

executables:
  GeneralService-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - GeneralService
    - aeson
    - bytestring
    - http-types
    - text
    - wai
    - warp

tests:
  GeneralService-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - GeneralService
